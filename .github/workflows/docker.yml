name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker build inputs
        run: python3 -m unittest discover -s tests -p test_docker_packaging.py

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version="\([^"]*\)"$/\1/p' synology/package/INFO)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/littleweirdlab0514-web/nasdrop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nasdrop:smoke
          build-args: |
            NASDROP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}

      - name: Start container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          config_dir="${RUNNER_TEMP}/nasdrop-config"
          download_dir="${RUNNER_TEMP}/nasdrop-downloads"
          mkdir -p "$config_dir" "$download_dir"
          docker run -d --name nasdrop-smoke \
            --read-only \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=256m,mode=1777 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -p 127.0.0.1:18791:8791 \
            -v "$config_dir:/config" \
            -v "$download_dir:/downloads" \
            nasdrop:smoke
          trap 'docker logs nasdrop-smoke || true; docker rm -f nasdrop-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:18791/api/auth/status); then
              printf '%s' "$response" | grep -q '"configured": true'
              printf '%s' "$response" | grep -q '"must_change_password": true'
              exit 0
            fi
            sleep 1
          done
          echo "NASDrop health endpoint did not become ready." >&2
          exit 1

      - name: Verify image embeds canonical server files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum backend.py transfer_parts.py gofile_wt.mjs \
            > "${RUNNER_TEMP}/source-core.sha256"
          docker run --rm --entrypoint sha256sum nasdrop:smoke \
            /app/backend.py /app/transfer_parts.py /app/gofile_wt.mjs \
            | sed 's# /app/# #' \
            > "${RUNNER_TEMP}/image-core.sha256"
          diff -u "${RUNNER_TEMP}/source-core.sha256" "${RUNNER_TEMP}/image-core.sha256"

          (
            cd synology/web
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "${RUNNER_TEMP}/source-web.sha256"
          docker run --rm --entrypoint sh nasdrop:smoke -c \
            'cd /app/synology/web && find . -type f -print0 | sort -z | xargs -0 sha256sum' \
            > "${RUNNER_TEMP}/image-web.sha256"
          diff -u "${RUNNER_TEMP}/source-web.sha256" "${RUNNER_TEMP}/image-web.sha256"

      - name: Build and publish amd64/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NASDROP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
